# Project-wide Gradle settings.
# Kotlin compile dans ce processus : son heap est celui de Gradle.
# La CI réserve 6 Gio et isole les variantes sur des runners distincts.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
# BC 1.80 contient des variantes multi-release Java 21 ; ses classes de base
# sont Java 8 et ne référencent pas android.support. Aucun Jetifier nécessaire.
android.jetifier.ignorelist=bcprov.*
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
ksp.incremental=false
android.suppressUnsupportedCompileSdk=35
org.gradle.console=plain
