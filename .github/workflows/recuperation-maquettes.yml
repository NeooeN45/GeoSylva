name: Récupération des maquettes sur Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/maquettes/**'
      - '.github/workflows/recuperation-maquettes.yml'
permissions:
  contents: read
jobs:
  export-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Tester le lecteur d’export
        run: python -m unittest discover -s tools/maquettes -v
      - name: Préparer le lecteur portable x64
        run: python tools/maquettes/preparer_windows.py "$env:RUNNER_TEMP/Geosylva"
      - name: Vérifier le fonctionnement avec Python embarqué
        shell: pwsh
        run: |
          $base = "$env:RUNNER_TEMP/Geosylva"
          python -m zipfile -c "$env:RUNNER_TEMP/test.zip" docs/maquettes/cartographie/54.png
          & "$base/moteur/python.exe" "$base/moteur/recuperer.py" "$env:RUNNER_TEMP/test.zip" --destination "$env:RUNNER_TEMP/controle-export"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-ChildItem "$env:RUNNER_TEMP/controle-export/*/rapport.json" | Get-Content -Raw | ConvertFrom-Json
          if ($result.deja_conservees.Count -ne 1 -or $result.images.Count -ne 0) { throw 'Original enregistré mal reconnu.' }
      - name: Télécharger le lecteur prêt à ouvrir
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Geosylva-recuperation-Windows-x64
          path: ${{ runner.temp }}/Geosylva/
          if-no-files-found: error
