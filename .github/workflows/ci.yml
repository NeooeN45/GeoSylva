name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**', 'refactor/**', 'chore/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
env:
  GEOSYLVA_BUILD_ID: ${{ github.sha }}
  # Kotlin reste in-process : un seul heap pour Gradle et le compilateur.
  GEOSYLVA_CI_GRADLE_JVMARGS: -Xmx6g -Dfile.encoding=UTF-8

jobs:
  lint:
    name: Lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android Lint
        run: ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=$GEOSYLVA_CI_GRADLE_JVMARGS" lint --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html

  unit-test-variants:
    name: Unit Tests (${{ matrix.variant }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            tasks: testDebugUnitTest :capsule-verifier:test
          - variant: release
            tasks: testReleaseUnitTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=$GEOSYLVA_CI_GRADLE_JVMARGS" ${{ matrix.tasks }} --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report-${{ matrix.variant }}
          path: |
            app/build/reports/tests/
            cartography-mapbox/build/reports/tests/
            cartography-ui/build/reports/tests/
            cartography-preview/build/reports/tests/
            capsule-verifier/build/reports/tests/
            **/build/test-results/test*UnitTest/TEST-*.xml
            capsule-verifier/build/test-results/test/TEST-*.xml

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ matrix.variant }}
          path: app/build/reports/coverage/

  # Conserve le nom du contrôle existant pour les protections de branche.
  # Le succès exige les deux variantes ; aucun échec n'est ignoré.
  unit-tests:
    name: Unit Tests
    if: always()
    needs: [ unit-test-variants ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test variant
        env:
          VARIANT_RESULT: ${{ needs.unit-test-variants.result }}
        run: test "$VARIANT_RESULT" = "success"

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=$GEOSYLVA_CI_GRADLE_JVMARGS" assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release-verification:
    name: Release Bundle Verification
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Exécute R8 et la réduction des ressources de la vraie variante de
      # livraison. Le bundle reste volontairement non signé dans la CI.
      - name: Build unsigned release bundle
        run: ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=$GEOSYLVA_CI_GRADLE_JVMARGS" bundleRelease --stacktrace

  quality-gate:
    name: Quality Gate
    if: always()
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, build, release-verification ]
    steps:
      - name: Require every validation job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
          DEBUG_BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release-verification.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$DEBUG_BUILD_RESULT" = "success"
          test "$RELEASE_BUILD_RESULT" = "success"
